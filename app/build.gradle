plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.0.14'
}

group = 'ege-emre-pelin-talat'
description = 'this is a game library project for lecture ce216'

repositories {
    mavenCentral()
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics']
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'Main'
    // macOS Dock'ta "java" yerine uygulama adı ve simgesi görünsün.
    applicationDefaultJvmArgs = [
        '-Xdock:name=Oyun Kütüphanesi',
        "-Xdock:icon=${project.file('icon.png').absolutePath}"
    ]
}
